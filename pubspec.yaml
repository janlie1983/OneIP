name: oneip
description: "OneIP - Bộ công cụ thị trường bất động sản công nghiệp Việt Nam"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.0.0
  flutter_riverpod: ^2.0.0
  riverpod_annotation: ^2.0.0
  go_router: ^13.0.0
  fl_chart: ^0.68.0
  pdf: ^3.10.0
  printing: ^5.12.0
  freezed_annotation: ^2.4.0
  json_annotation: ^4.8.0
  dio: ^5.4.0
  shared_preferences: ^2.2.0
  google_sign_in: ^6.2.0
  flutter_dotenv: ^5.1.0
  intl: ^0.20.0
  google_fonts: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.0
  freezed: ^2.4.0
  json_serializable: ^6.7.0
  riverpod_generator: ^2.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - .env.development
    - .env.production
